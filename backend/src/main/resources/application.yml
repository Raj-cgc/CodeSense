spring:
  application:
    name: codesense-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/devpilot?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:5}
      minimum-idle: ${HIKARI_MIN_IDLE:1}
      idle-timeout: 30000
      max-lifetime: 60000
      connection-timeout: 30000
      validation-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:your_github_client_id}
            client-secret: ${GITHUB_CLIENT_SECRET:your_github_client_secret}
            scope:
              - read:user
              - user:email
              - repo
        provider:
          github:
            authorization-uri: https://github.com/login/oauth/authorize
            token-uri: https://github.com/login/oauth/access_token
            user-info-uri: https://api.github.com/user
            user-name-attribute: login

  session:
    timeout: 7d

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:your_gemini_api_key}
        chat:
          options:
            model: ${GEMINI_CHAT_MODEL:gemini-2.5-flash}
            temperature: 0.2
        embedding:
          api-key: ${GEMINI_API_KEY:your_gemini_api_key}
          text:
            model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
            dimensions: ${GEMINI_EMBEDDING_DIMENSIONS:3072}
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:your_qdrant_host}
        port: ${QDRANT_PORT:6334}
        api-key: ${QDRANT_API_KEY:your_qdrant_api_key}
        use-tls: ${QDRANT_USE_TLS:true}
        collection-name: ${QDRANT_COLLECTION_NAME:codesense-code}
        initialize-schema: false
        check-compatibility: false

server:
  address: 0.0.0.0
  port: ${PORT:10000}
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:25}
      min-spare: ${TOMCAT_MIN_SPARE:2}
    accept-count: 20
    max-connections: 100
  servlet:
    session:
      cookie:
        name: CODESENSE_SESSION
        same-site: none
        secure: true
        http-only: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  token-encryptor-password: ${TOKEN_ENCRYPTOR_PASSWORD:codesense-secret-key-2026}
  token-encryptor-salt: ${TOKEN_ENCRYPTOR_SALT:deadbeefcafe1234}
  indexing:
    max-file-bytes: 102400
